services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: >
      gunicorn hairitage.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 2
      --timeout 120
    env_file:
      - ./.env.production
    environment:
      COLLECT_STATIC: "1"
    depends_on:
      - db
    expose:
      - 8000
    restart: unless-stopped
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media

  db:
    image: postgres:15
    env_file:
      - .env.db.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped
    volumes:
      - static_volume:/home/app/web/static:ro
      - media_volume:/home/app/web/media:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_etc:
  certbot_www:
