upstream hairitage {
    server web:8000;
}

server {
    listen 80;
    server_name hairitage-studio.co.za www.hairitage-studio.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hairitage-studio.co.za www.hairitage-studio.co.za;

    ssl_certificate /etc/letsencrypt/live/hairitage-studio.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hairitage-studio.co.za/privkey.pem;

    location /static/ {
        alias /home/app/web/static/;
    }

    location /media/ {
        alias /home/app/web/media/;
    }

    location / {
        proxy_pass http://hairitage;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        client_max_body_size 100M;
    }
}
