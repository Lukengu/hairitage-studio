 {% for post in posts %}
         <div class="block-21 mb-4 d-flex">
             <a href="/blog/details.html?id={{ post.id }}" class="blog-img mr-4" style="background-image: url({{ post.image.url }});"></a>
             <div class="text">
                 <h3 class="heading"><a href="/blog/details.html?id={{ post.id }}">{{ post.title }}</a></h3>
                 <div class="meta">
                     <div><a href="#"><span class="icon-calendar"></span> {{ post.date }}</a></div>
                     <div><a href="#"><span class="icon-person"></span> {{ post.user_id }}</a></div>
                     {% if post.comment_count > 0 %}
                     <div><a href="#"><span class="icon-chat"></span> {{ post.comment_count }}</a></div>
                     {% endif %}
                 </div>
             </div>
         </div>
    {% endfor %}
