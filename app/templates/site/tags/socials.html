<ul class="ftco-footer-social list-unstyled float-md-left float-lft mt-5">
{% if twitter %}
<li class="ftco-animate">
    <a target="_blank" rel="noopener noreferrer" href="{{ twitter }}"><span class="icon-twitter"></span></a>
</li>
{% endif %}
{% if facebook %}
<li class="ftco-animate">
    <a target="_blank" rel="noopener noreferrer" href="{{ facebook }}"><span class="icon-facebook"></span></a>
</li>
{% endif %}
{% if instagram %}
<li class="ftco-animate">
    <a target="_blank" rel="noopener noreferrer" href="{{ instagram }}"><span class="icon-instagram"></span></a>
</li>
{% endif %}
{% if linkedin %}
<li class="ftco-animate">
    <a target="_blank" rel="noopener noreferrer" href="{{ linkedin }}"><span class="icon-linkedin"></span></a>
</li>
{% endif %}
{% if tiktok %}
<li class="ftco-animate">
    <a target="_blank" rel="noopener noreferrer" href="{{ tiktok }}" aria-label="TikTok">
        <span class="icon-tiktok">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.77 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>
            </svg>
        </span>
    </a>
</li>
{% endif %}
</ul>
